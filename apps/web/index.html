<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ardenvia Bank — Everyday banking, clearly</title>
    <meta name="description" content="Manage everyday spending, savings, transfers, and cards from one clear account." />
    <meta name="theme-color" content="#f5f4fa" />
    <meta property="og:title" content="Ardenvia Bank — Everyday banking, clearly" />
    <meta property="og:description" content="Your money, without the noise." />
    <meta property="og:image" content="/banking-hero.png" />
    <link rel="icon" type="image/svg+xml" href="/ardenvia-icon.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="/ardenvia-icon.svg" />
    <link rel="apple-touch-icon" href="/ardenvia-icon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (() => {
        try {
          const preference = localStorage.getItem("ardenvia-bank-theme") || localStorage.getItem("clipx-theme") || "system";
          const isDark = preference === "dark" || (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", isDark ? "#17141f" : "#f5f4fa");
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
